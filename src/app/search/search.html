<section class="search-container">
    <h1>DevPulse</h1>
    <p class="subtitle">Explora perfiles de GitHub</p>

    <div class="search-box">
        <input 
            type="text" 
            placeholder="Nombre de usuario..." 
            [value]="username()" 
            (input)="username.set($any($event.target).value)"
        />
    </div>

    @if (error()) {
        <p class="error">{{ error() }}</p>
    }

    @if (user()) {
        <div class="result" (click)="navigateToProfile(user()!.login)">
            <p class="hint">Haz clic para ver el perfil completo</p>
            <app-user-card [user]="user()"></app-user-card>
        </div>
    }
</section>
